<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="refresh" content="0; url=./hotspot-map.html" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SNEEM Site Induction</title>
    <style>
      :root {
        --navy: #12344a;
        --teal: #0e7a8a;
        --bg: #f5f7f8;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(180deg, #edf3f5 0%, var(--bg) 100%);
        color: #1f2a30;
      }

      .box {
        width: min(90vw, 520px);
        background: #fff;
        border-top: 6px solid var(--navy);
        box-shadow: 0 12px 30px rgba(18, 52, 74, 0.12);
        padding: 32px 28px;
        text-align: center;
      }

      h1 {
        margin: 0 0 12px;
        color: var(--navy);
        font-size: clamp(2rem, 5vw, 2.5rem);
      }

      p {
        margin: 0 0 18px;
        line-height: 1.6;
        color: #4e5d67;
      }

      a {
        display: inline-block;
        padding: 12px 18px;
        background: var(--teal);
        color: #fff;
        text-decoration: none;
        font-weight: 700;
      }

      a:hover,
      a:focus-visible {
        background: #0a6470;
      }
    </style>
  </head>
  <body>
    <main class="box">
      <h1>SNEEM Site Induction</h1>
      <p>Opening the site map...</p>
      <a href="./hotspot-map.html">Open hotspot map</a>
    </main>
  </body>
</html>
