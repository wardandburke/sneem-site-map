<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SNEEM Site Induction</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, sans-serif;
      color: #202428;
      background: #f3f5f7;
    }

    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      place-items: center;
      padding: 24px;
      box-sizing: border-box;
    }

    main {
      width: min(100%, 560px);
      padding: 40px;
      background: #ffffff;
      border-top: 6px solid #0076a3;
      box-shadow: 0 12px 30px rgba(32, 36, 40, 0.14);
    }

    h1 {
      margin: 0 0 12px;
      color: #1d2d3d;
    }

    p {
      margin: 0 0 28px;
      line-height: 1.5;
    }

    a {
      display: inline-block;
      padding: 12px 18px;
      background: #ac1f2d;
      color: #ffffff;
      font-weight: 700;
      text-decoration: none;
    }

    a:hover,
    a:focus-visible {
      background: #8f1925;
    }
  </style>
</head>
<body>
  <main>
    <h1>SNEEM Site Induction</h1>
    <p>Open the site map to view induction information, work areas, welfare facilities, and site controls.</p>
    <a href="./hotspot-map.html">Open site map</a>
  </main>
</body>
</html>
